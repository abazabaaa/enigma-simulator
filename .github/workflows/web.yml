name: web

# PLAN §2.8. Pushes to master and the integration branch, every pull request, and manual runs.
on:
  push:
    branches: [master, claude/intelligent-hamilton-r0i6wz]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: web

jobs:
  check:
    name: oracle + check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The ownership check diffs the PR against its base branch.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Reference implementation and fixture freshness
        working-directory: .
        run: |
          python3 tools/reference_enigma.py
          for f in tools/export_*.py; do python3 "$f" --check; done

      - run: npm ci

      - name: Typecheck, unit tests, build, budget, ownership
        env:
          OWNERSHIP_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          OWNERSHIP_PR: ${{ github.head_ref }}
        run: npm run check

  e2e:
    name: e2e 2d (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # CI runners are not the dev container: install the Chromium matching @playwright/test here.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=2d --shard=${{ matrix.shard }}/2
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-2d-${{ matrix.shard }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  e2e-3d:
    name: e2e 3d
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=3d
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-3d
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  walk:
    name: course walk
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The walk spec arrives with the lesson runtime (PR 05); until then there is nothing to walk.
      - run: npx playwright test --project=walk --pass-with-no-tests
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-walk
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # The in-session "deploy-ready" proof: a Pages artifact built under the Pages base path.
  pages-artifact:
    name: GitHub Pages artifact
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/claude/intelligent-hamilton-r0i6wz') }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build for GitHub Pages
        env:
          VITE_BASE: /enigma-simulator/
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    name: deploy to GitHub Pages
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs: [pages-artifact, e2e, e2e-3d, walk]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
